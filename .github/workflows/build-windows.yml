name: Build Windows Executable

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches: [ main, master ]
    paths:
      - '*.py'
      - '*.spec'
      - 'build_executable.bat'
      - 'pizza_icon.ico'
      - 'create_icon.py'
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Find project directory
      shell: cmd
      run: |
        echo Current directory:
        cd
        echo.
        echo Listing files in root:
        dir /b
        echo.
        echo Looking for project files...
        if exist "bobs_pizza_emporium\pizza_pos.spec" (
          echo Found files in bobs_pizza_emporium subdirectory
          set PROJECT_DIR=bobs_pizza_emporium
        ) else if exist "pizza_pos.spec" (
          echo Found files in root directory
          set PROJECT_DIR=.
        ) else (
          echo ERROR: Could not find pizza_pos.spec in root or bobs_pizza_emporium subdirectory
          exit /b 1
        )
        echo Project directory: %PROJECT_DIR%
        echo PROJECT_DIR=%PROJECT_DIR%>> %GITHUB_ENV%
      
    - name: Verify files and working directory
      shell: cmd
      run: |
        echo Current directory:
        cd
        echo.
        echo Project directory: %PROJECT_DIR%
        cd %PROJECT_DIR%
        echo Changed to: %CD%
        echo.
        echo Listing files:
        dir /b
        echo.
        echo Checking for required files:
        if exist "pizza_pos.spec" (echo [OK] pizza_pos.spec found) else (echo [ERROR] pizza_pos.spec NOT found && exit /b 1)
        if exist "pizza_icon.ico" (echo [OK] pizza_icon.ico found) else (echo [WARN] pizza_icon.ico NOT found)
        if exist "launch.py" (echo [OK] launch.py found) else (echo [ERROR] launch.py NOT found && exit /b 1)
        if exist "pizza_pos_app.py" (echo [OK] pizza_pos_app.py found) else (echo [ERROR] pizza_pos_app.py NOT found && exit /b 1)
        if exist "create_icon.py" (echo [OK] create_icon.py found) else (echo [INFO] create_icon.py NOT found)
        echo.
        echo All required files verified!
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install Pillow
      
    - name: Check for icon file
      shell: cmd
      run: |
        cd %PROJECT_DIR%
        if not exist "pizza_icon.ico" (
          echo Creating icon file...
          if exist "create_icon.py" (
            python create_icon.py
          ) else (
            echo WARNING: create_icon.py not found, but icon is optional. Continuing...
          )
        ) else (
          echo Icon file found.
        )
      
    - name: Build executable
      shell: cmd
      run: |
        cd %PROJECT_DIR%
        echo Building from directory: %CD%
        echo.
        echo Verifying spec file exists:
        if not exist "pizza_pos.spec" (
          echo ERROR: pizza_pos.spec not found in current directory!
          exit /b 1
        )
        echo.
        echo Running: pyinstaller pizza_pos.spec
        pyinstaller pizza_pos.spec
        if errorlevel 1 (
          echo.
          echo Build failed! Checking for error details...
          if exist "build\pizza_pos\warn-pizza_pos.txt" (
            echo.
            echo Warnings/Errors from PyInstaller:
            type build\pizza_pos\warn-pizza_pos.txt
          )
          exit /b 1
        )
        
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: BobsPizzaEmporium-Windows
        path: ${{ env.PROJECT_DIR }}/dist/BobsPizzaEmporium.exe
        
    - name: Create release (if triggered by release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PROJECT_DIR }}/dist/BobsPizzaEmporium.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

